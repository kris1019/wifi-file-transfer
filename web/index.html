<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WiFi File Transfer</title>
<style>body{margin:0;font-family:system-ui;background:#0b1020;color:#eef2ff}main{max-width:850px;margin:auto;padding:24px 14px}.card{background:#151c33;border:1px solid #293353;border-radius:18px;padding:20px;margin:14px 0}.drop{display:block;border:2px dashed #53648f;border-radius:14px;padding:35px;text-align:center;cursor:pointer}button{border:0;border-radius:10px;padding:10px 14px;background:#6d8cff;color:#fff;font-weight:700;cursor:pointer}.danger{background:#c94d61}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #293353}.name{overflow:hidden;text-overflow:ellipsis}.muted{color:#91a0c3;font-size:13px}.bar{height:8px;background:#293353;border-radius:9px;margin-top:12px}.fill{height:100%;width:0;background:#6d8cff}.hidden{display:none}</style></head><body><main>
<h1>📁 WiFi File Transfer</h1><p class="muted">Same WiFi = fast local transfer.</p>
<div class="card"><label class="drop" for="file"><b>Choose files</b><br><span class="muted">or drag and drop</span></label><input id="file" type="file" multiple hidden><div id="progress" class="hidden"><p id="status"></p><div class="bar"><div id="fill" class="fill"></div></div></div></div>
<div class="card"><div style="display:flex;justify-content:space-between"><h2>Files</h2><button onclick="load()">Refresh</button></div><div id="list"></div></div></main>
<script>
const input=document.getElementById("file"),list=document.getElementById("list"),progress=document.getElementById("progress"),status=document.getElementById("status"),fill=document.getElementById("fill");
input.onchange=()=>upload([...input.files]);
document.querySelector(".drop").ondragover=e=>e.preventDefault();
document.querySelector(".drop").ondrop=e=>{e.preventDefault();upload([...e.dataTransfer.files])};
function size(n){return n<1024?n+" B":n<1048576?(n/1024).toFixed(1)+" KB":n<1073741824?(n/1048576).toFixed(1)+" MB":(n/1073741824).toFixed(2)+" GB"}
function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
async function upload(files){for(const file of files){progress.classList.remove("hidden");status.textContent="Uploading "+file.name;await new Promise((resolve,reject)=>{const x=new XMLHttpRequest();x.open("POST","/api/upload");x.upload.onprogress=e=>{if(e.lengthComputable){fill.style.width=(e.loaded/e.total*100)+"%";status.textContent="Uploading "+file.name+" — "+Math.round(e.loaded/e.total*100)+"%"}};x.onload=()=>x.status<300?resolve():reject(new Error("Upload failed: "+x.status));x.onerror=()=>reject(new Error("Network error"));const f=new FormData();f.append("file",file,file.name);x.send(f)}).catch(e=>alert(e.message))}progress.classList.add("hidden");input.value="";load()}
async function load(){try{const r=await fetch("/api/files",{cache:"no-store"});const files=await r.json();list.innerHTML="";if(!files.length){list.innerHTML='<p class="muted">No files yet.</p>';return}for(const f of files){const row=document.createElement("div");row.className="row";row.innerHTML='<div class="name"><b>'+esc(f.name)+'</b><br><span class="muted">'+size(f.size)+'</span></div><div><button class="download">Download</button> <button class="danger delete">Delete</button></div>';row.querySelector(".download").onclick=()=>{const a=document.createElement("a");a.href="/download/"+encodeURIComponent(f.name);a.download=f.name;a.target="_blank";document.body.appendChild(a);a.click();a.remove()};row.querySelector(".delete").onclick=async()=>{if(confirm("Delete "+f.name+"?")){await fetch("/api/files/"+encodeURIComponent(f.name),{method:"DELETE"});load()}};list.appendChild(row)}}catch(e){list.innerHTML='<p class="muted">Could not load files.</p>'}}
load();
</script></body></html>
